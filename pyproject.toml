[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
# Ruff's default ruleset (pyflakes F + curated pycodestyle E4/E7/E9). The
# ignore list is inherited fork debt — stylistic, not bugs — to be paid down
# incrementally. Real-defect rules (syntax E9xx, undefined names F821, etc.)
# stay active.
ignore = [
    "E501", # line length — left to the formatter, not gated
    "E701", # multiple statements on one line (compact guard clauses)
    "E722", # bare except (pervasive in best-effort cleanup paths)
    "E401", # multiple imports on one line
    "E402", # module import not at top (intentional conditional imports)
    "F401", # unused import
    "F541", # f-string without placeholders
    "F811", # redefined-while-unused
    "F841", # unused local variable
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests self-skip when no saved session / FILEN_* creds are present
# (see @unittest.skipUnless), so a plain run is hermetic in CI.
python_files = ["test_*.py"]
